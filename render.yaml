databases:
  - name: osrsgeflip
    databaseName: osrsgeflip
    user: osrs
    plan: free

services:
  - type: web
    name: osrs-ge-flipper-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: osrsgeflip
          property: host
      - key: DB_PORT
        fromDatabase:
          name: osrsgeflip
          property: port
      - key: DB_NAME
        fromDatabase:
          name: osrsgeflip
          property: database
      - key: DB_USER
        fromDatabase:
          name: osrsgeflip
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: osrsgeflip
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: osrs-ge-flipper
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
