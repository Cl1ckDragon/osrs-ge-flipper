spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/osrsgeflip}
    username: ${DB_USER:osrs}
    password: ${DB_PASSWORD:osrs}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

osrs:
  wiki:
    base-url: https://prices.runescape.wiki/api/v1/osrs
    user-agent: OSRS-GE-Flipper/1.0 (${CONTACT_EMAIL:contact@example.com})

jwt:
  secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-32-chars}
  expiration-ms: 86400000

snapshot:
  interval-ms: ${SNAPSHOT_INTERVAL_MS:300000}
